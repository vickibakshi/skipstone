<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Skip Stone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://www.youtube.com/game_api/v1"></script>
<style>
/* Concept: full-bleed 3D lake. HUD floats over the scene: hearts (left), distance and lake progress (centre), sound (right). Story cards sit at the bottom. */
:root {
  --night: #14213d;
  --teal: #0f4c5c;
  --peach: #ffb48a;
  --foam: #fff3e6;
  --gold: #ffd166;
  --rose: #ef476f;
  --font-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--night);
  color: var(--foam);
  font-family: var(--font-body);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--night); }

.hud {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  text-shadow: 0 2px 0 rgba(20, 33, 61, 0.45);
}
.top {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: start;
  gap: 8px;
}
.hearts { display: flex; align-items: center; padding-top: 6px; }
.hearts svg { width: 26px; height: 26px; margin-right: 3px; stroke: var(--foam); stroke-width: 1.6; stroke-linejoin: round; }
.hearts .full { fill: var(--rose); }
.hearts .empty { fill: none; opacity: 0.5; }
.scorebox { text-align: center; min-width: 0; }
.lake { font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.9; }
.scorerow { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
#score { font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 12vw, 70px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.unit { font-family: var(--font-display); font-size: 20px; font-weight: 600; opacity: 0.85; }
.goal { font-size: 13px; font-weight: 800; opacity: 0.85; font-variant-numeric: tabular-nums; }
.bar { width: min(46vw, 220px); height: 8px; border-radius: 4px; background: rgba(255, 243, 230, 0.28); margin: 6px auto 0; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); }
.combo {
  display: inline-block;
  margin-top: 8px;
  padding: 3px 12px;
  border-radius: 999px;
  background: var(--gold);
  color: var(--night);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 16px;
  text-shadow: none;
}
.hint {
  margin: 8px auto 0;
  max-width: 26ch;
  font-weight: 800;
  font-size: 15px;
  color: var(--peach);
  opacity: 0;
  transition: opacity 0.3s;
}
.hint.on { opacity: 1; }
#snd {
  justify-self: end;
  pointer-events: auto;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid rgba(255, 243, 230, 0.55);
  background: rgba(20, 33, 61, 0.35);
  color: var(--foam);
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
}
#snd:focus-visible, .restart:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#snd svg { width: 22px; height: 22px; }
#snd .off { display: none; }
#snd[aria-pressed="true"] .on { display: none; }
#snd[aria-pressed="true"] .off { display: block; }

.toast {
  position: absolute;
  left: 50%;
  top: 38%;
  transform: translateX(-50%);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(30px, 9vw, 46px);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
}
.toast[data-grade="perfect"] { color: var(--gold); }
.toast[data-grade="good"] { color: var(--foam); }
.toast[data-grade="weak"] { color: var(--peach); }
.toast[data-grade="bonus"] { color: var(--gold); font-size: clamp(24px, 7vw, 34px); }
.toast.on { animation: rise 0.8s ease-out forwards; }
@keyframes rise {
  0% { opacity: 0; transform: translate(-50%, 12px) scale(0.85); }
  15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
  70% { opacity: 1; transform: translate(-50%, -18px) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -34px) scale(1); }
}
@keyframes fade { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

.panel {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding-top: 48px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 4vh);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  text-align: center;
  background: linear-gradient(to top, rgba(20, 33, 61, 0.62) 55%, rgba(20, 33, 61, 0));
}
.panel h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(40px, 12vw, 76px);
  line-height: 1;
  text-wrap: balance;
  text-shadow: 0 4px 0 rgba(20, 33, 61, 0.55);
}
.panel p { margin: 10px auto 0; max-width: 34ch; font-weight: 800; font-size: 16px; line-height: 1.38; text-wrap: balance; }
.panel .story { font-weight: 600; font-size: 15px; }
.panel .sub { color: var(--peach); font-weight: 800; font-size: 14px; }
.panel .kicker { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; color: var(--peach); margin-bottom: 6px; }
.panel .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 11vw, 56px); line-height: 1; margin-top: 10px; font-variant-numeric: tabular-nums; }
.cta {
  display: inline-block;
  margin-top: 16px;
  padding: 12px 28px;
  border-radius: 999px;
  background: var(--gold);
  color: var(--night);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  text-shadow: none;
  animation: pulse 1.6s ease-in-out infinite;
}
.restart {
  pointer-events: auto;
  display: block;
  margin: 8px auto 0;
  background: none;
  border: none;
  color: var(--foam);
  opacity: 0.8;
  font: 800 13px var(--font-body);
  text-decoration: underline;
  cursor: pointer;
  padding: 8px 12px;
}
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) {
  .toast.on { animation: fade 0.8s linear forwards; }
  .cta { animation: none; }
}
</style>
</head>
<body>

<canvas id="c" aria-label="Skip Stone game scene"></canvas>
<div class="hud">
  <div class="top">
    <div class="hearts" id="hearts" aria-label="Hearts left"></div>
    <div class="scorebox">
      <div class="lake" id="lake">Lake 1 · Dawn Pond</div>
      <div class="scorerow"><div id="score">0</div><div class="unit">m</div></div>
      <div class="goal" id="goal">of 150 m</div>
      <div class="bar"><i id="barfill"></i></div>
      <div id="combo" class="combo" hidden></div>
      <div id="hint" class="hint"></div>
    </div>
    <button id="snd" type="button" aria-label="Sound" aria-pressed="false">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg>
    </button>
  </div>
  <div id="toast" class="toast" data-grade="good"></div>
  <div id="panel" class="panel"></div>
</div>

<script src="vendor/three.min.js"></script>
<script>
  // Local dev only: the Playables build ships vendor/three.min.js, so this never fires there.
  if (typeof THREE === 'undefined') document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
</script>
<script src="rules.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var panel = $('panel');
  if (typeof THREE === 'undefined' || typeof SkipRules === 'undefined') {
    panel.innerHTML = '<h1>Skip Stone</h1><p>The 3D engine did not load. Check your connection and reload.</p>';
    return;
  }
  var R = SkipRules;
  var yt = window.ytgame && ytgame.IN_PLAYABLES_ENV ? ytgame : null;

  /* ---------- story and lakes ---------- */
  var PROLOGUE = 'Pip is a small grey pebble from the bottom of a mountain stream. One night an old frog tells Pip: skip across the five lakes to reach the Moon Shore, where brave stones become stars. Pip decides to try.';
  var ENDING = 'Pip slides onto the silver sand of the Moon Shore. The Moon smiles, and a soft light lifts Pip into the sky, where the other stones are waiting. Every night after, one small star blinks down at the lakes. It is the one that never gave up skipping.';
  // Gameplay numbers live in rules.js (LEVEL_RULES); these are the look and story of each lake.
  var LEVELS = [
    { name: 'Dawn Pond',
      intro: 'Tap when the two rings meet. A few small rocks to hop over.',
      outro: 'The old frog croaks from a lily pad: "Not bad for a pebble."',
      sky: [[0.09, 0.14, 0.34], [0.52, 0.30, 0.55], [1.0, 0.70, 0.54]],
      water: [[0.05, 0.22, 0.29], [0.12, 0.36, 0.45], [1.0, 0.70, 0.54]], glit: [1.0, 0.85, 0.65],
      sun: 0xffe6c9, glow: 0xffc896, mtn: [0x6a4a86, 0x3a3668], stars: false },
    { name: 'Reed Creek',
      intro: 'New: floating logs. Hop high to clear them.',
      outro: 'A heron watches Pip skip past. "Keep going," she says.',
      sky: [[0.20, 0.35, 0.62], [0.90, 0.62, 0.48], [1.0, 0.85, 0.55]],
      water: [[0.05, 0.28, 0.30], [0.15, 0.45, 0.45], [1.0, 0.85, 0.55]], glit: [1.0, 0.92, 0.6],
      sun: 0xfff0c0, glow: 0xffd88a, mtn: [0x7a6a8a, 0x44486e], stars: false },
    { name: 'Lily Marsh',
      intro: 'New: whirlpools. Do not land in them, and the water gets faster.',
      outro: 'The fireflies dance around Pip. "We will light your way," they whisper.',
      sky: [[0.12, 0.22, 0.30], [0.35, 0.50, 0.45], [0.95, 0.80, 0.50]],
      water: [[0.04, 0.22, 0.20], [0.10, 0.36, 0.30], [0.95, 0.80, 0.50]], glit: [0.95, 0.9, 0.55],
      sun: 0xf6e6a8, glow: 0xe8d070, mtn: [0x3f6a5e, 0x24433f], stars: false },
    { name: 'Misty Mirror',
      intro: 'New: low bridges. Duck under with a softer, non-perfect hop. Now and then, obstacles come in pairs.',
      outro: 'Pip sees its own reflection, a little brighter than before.',
      sky: [[0.18, 0.16, 0.38], [0.55, 0.45, 0.70], [0.85, 0.80, 0.95]],
      water: [[0.08, 0.14, 0.30], [0.22, 0.30, 0.50], [0.85, 0.80, 0.95]], glit: [0.9, 0.85, 1.0],
      sun: 0xf0e8ff, glow: 0xc8b8f0, mtn: [0x5a4a86, 0x2e2a5e], stars: false },
    { name: 'Moon Lake',
      intro: 'New: obstacles often come in pairs, and everything moves at top speed. The Moon Shore glows ahead.',
      outro: '',
      sky: [[0.02, 0.03, 0.10], [0.08, 0.10, 0.28], [0.25, 0.30, 0.55]],
      water: [[0.01, 0.04, 0.12], [0.05, 0.12, 0.28], [0.25, 0.30, 0.55]], glit: [0.7, 0.8, 1.0],
      sun: 0xe6eeff, glow: 0x9fb4ff, mtn: [0x1c2150, 0x0e1236], stars: true }
  ].map(function (v, i) {
    var r = R.LEVEL_RULES[i];
    for (var k in r) v[k] = r[k];
    return v;
  });

  /* ---------- renderer, scene, camera ---------- */
  var canvas = $('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(60, 1, 0.1, 500);
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = (w / h) < 0.8 ? 72 : 58;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  scene.add(new THREE.HemisphereLight(0xffd9c0, 0x1d2a5b, 0.95));
  var sunLight = new THREE.DirectionalLight(0xffb48a, 0.9);
  sunLight.position.set(0, 8, -12);
  scene.add(sunLight);

  /* ---------- sky, stars, sun, mountains ---------- */
  var skyU = { uTop: { value: new THREE.Vector3() }, uMid: { value: new THREE.Vector3() }, uHor: { value: new THREE.Vector3() } };
  var sky = new THREE.Mesh(
    new THREE.SphereGeometry(400, 24, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: skyU,
      vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'varying vec3 vP; uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uHor; void main(){ float h = normalize(vP).y; vec3 c = mix(uHor, uMid, smoothstep(0.0,0.22,h)); c = mix(c, uTop, smoothstep(0.2,0.75,h)); gl_FragColor = vec4(c,1.0); }'
    })
  );
  sky.renderOrder = -10;
  scene.add(sky);

  var starPos = new Float32Array(260 * 3);
  for (var si = 0; si < 260; si++) {
    var a1 = Math.random() * 6.283, y1 = 0.06 + Math.random() * 0.94, r1 = Math.sqrt(1 - y1 * y1);
    starPos[si * 3] = Math.cos(a1) * r1 * 350;
    starPos[si * 3 + 1] = y1 * 350;
    starPos[si * 3 + 2] = Math.sin(a1) * r1 * 350;
  }
  var starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  var stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0.9, depthWrite: false }));
  stars.visible = false;
  scene.add(stars);

  function glowTexture(inner, outer) {
    var cv = document.createElement('canvas');
    cv.width = cv.height = 128;
    var g = cv.getContext('2d');
    var grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grd.addColorStop(0, inner);
    grd.addColorStop(1, outer);
    g.fillStyle = grd;
    g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(cv);
  }

  var far = new THREE.Group();
  scene.add(far);
  var sunDisc = new THREE.Mesh(new THREE.CircleGeometry(15, 40), new THREE.MeshBasicMaterial({ color: 0xffe6c9 }));
  sunDisc.position.set(0, 24, -240);
  far.add(sunDisc);
  var sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture('rgba(255,255,255,0.85)', 'rgba(255,255,255,0)'), color: 0xffc896, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  sunGlow.scale.set(150, 150, 1);
  sunGlow.position.set(0, 24, -238);
  far.add(sunGlow);
  var mtnGeo = new THREE.ConeGeometry(1, 1, 5);
  var mtnMats = [];
  [
    { x: -150, z: -205, w: 70, h: 44, row: 0 }, { x: -95, z: -200, w: 60, h: 34, row: 0 },
    { x: 100, z: -205, w: 70, h: 40, row: 0 }, { x: 155, z: -200, w: 64, h: 50, row: 0 },
    { x: -120, z: -172, w: 66, h: 30, row: 1 }, { x: -62, z: -170, w: 46, h: 22, row: 1 },
    { x: 66, z: -170, w: 50, h: 24, row: 1 }, { x: 125, z: -174, w: 70, h: 32, row: 1 }
  ].forEach(function (m) {
    var mat = new THREE.MeshBasicMaterial({ color: 0x6a4a86 });
    mtnMats.push({ mat: mat, row: m.row });
    var mesh = new THREE.Mesh(mtnGeo, mat);
    mesh.scale.set(m.w, m.h, m.w * 0.7);
    mesh.position.set(m.x, m.h / 2 - 2, m.z);
    far.add(mesh);
  });

  /* ---------- water ---------- */
  var waterU = {
    uTime: { value: 0 },
    uDeep: { value: new THREE.Vector3() }, uShallow: { value: new THREE.Vector3() },
    uHorizon: { value: new THREE.Vector3() }, uGlit: { value: new THREE.Vector3() }
  };
  var waterMat = new THREE.ShaderMaterial({
    uniforms: waterU,
    vertexShader: 'varying vec3 vW; void main(){ vW = (modelMatrix * vec4(position,1.0)).xyz; gl_Position = projectionMatrix * viewMatrix * vec4(vW,1.0); }',
    fragmentShader: [
      'varying vec3 vW; uniform float uTime; uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uHorizon; uniform vec3 uGlit;',
      'void main(){',
      '  vec2 p = vW.xz;',
      '  float dist = length(p - cameraPosition.xz);',
      '  float f = 1.0 - exp(-dist * 0.012);',
      '  vec3 col = mix(uDeep, uShallow, smoothstep(0.0,0.5,f));',
      '  col = mix(col, uHorizon, pow(f,1.6));',
      '  float w = sin(p.x*1.3 + uTime*0.8) * sin(p.y*0.9 - uTime*0.6) + sin(p.x*0.5 - p.y*0.7 + uTime*0.5);',
      '  col += 0.04 * w * (1.0 - f);',
      '  float lane = exp(-abs(p.x) * 0.035);',
      '  float glit = smoothstep(0.55, 0.95, sin(p.x*3.1 + uTime*1.3) * sin(p.y*2.3 - uTime*0.9)) * lane * f * (1.0 - f*0.4);',
      '  col += uGlit * glit * 0.5;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n')
  });
  var water = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), waterMat);
  water.rotation.x = -Math.PI / 2;
  scene.add(water);

  function applyPalette(i) {
    var L = LEVELS[i];
    skyU.uTop.value.set(L.sky[0][0], L.sky[0][1], L.sky[0][2]);
    skyU.uMid.value.set(L.sky[1][0], L.sky[1][1], L.sky[1][2]);
    skyU.uHor.value.set(L.sky[2][0], L.sky[2][1], L.sky[2][2]);
    waterU.uDeep.value.set(L.water[0][0], L.water[0][1], L.water[0][2]);
    waterU.uShallow.value.set(L.water[1][0], L.water[1][1], L.water[1][2]);
    waterU.uHorizon.value.set(L.water[2][0], L.water[2][1], L.water[2][2]);
    waterU.uGlit.value.set(L.glit[0], L.glit[1], L.glit[2]);
    sunDisc.material.color.setHex(L.sun);
    sunGlow.material.color.setHex(L.glow);
    mtnMats.forEach(function (m) { m.mat.color.setHex(L.mtn[m.row]); });
    stars.visible = L.stars;
  }

  /* ---------- stone, shadow, landing marker ---------- */
  var stone = new THREE.Group();
  var stoneMat = new THREE.MeshStandardMaterial({ color: 0xaab4c4, roughness: 0.75, metalness: 0.0, emissive: 0x000000 });
  var disc = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.31, 0.1, 18), stoneMat);
  stone.add(disc);
  var stoneGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture('rgba(255,235,170,1)', 'rgba(255,209,102,0)'), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  stoneGlow.scale.set(0.01, 0.01, 1);
  stone.add(stoneGlow);
  scene.add(stone);
  var shadow = new THREE.Mesh(new THREE.CircleGeometry(0.32, 20), new THREE.MeshBasicMaterial({ color: 0x0a1224, transparent: true, opacity: 0.3, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.02;
  scene.add(shadow);

  var marker = new THREE.Group();
  var innerMat = new THREE.MeshBasicMaterial({ color: 0xfff3e6, transparent: true, opacity: 0.95, depthWrite: false, side: THREE.DoubleSide });
  var outerMat = new THREE.MeshBasicMaterial({ color: 0xfff3e6, transparent: true, opacity: 0.6, depthWrite: false, side: THREE.DoubleSide });
  var innerRing = new THREE.Mesh(new THREE.RingGeometry(0.4, 0.5, 40), innerMat);
  var outerRing = new THREE.Mesh(new THREE.RingGeometry(0.93, 1.0, 48), outerMat);
  innerRing.rotation.x = outerRing.rotation.x = -Math.PI / 2;
  marker.add(innerRing);
  marker.add(outerRing);
  marker.position.y = 0.04;
  marker.visible = false;
  scene.add(marker);

  /* ---------- ripples and splash ---------- */
  var ripples = [];
  var rippleGeo = new THREE.RingGeometry(0.88, 1, 48);
  function addRipple(dd, color, max, life) {
    var m = new THREE.Mesh(rippleGeo, new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.85, depthWrite: false, side: THREE.DoubleSide }));
    m.rotation.x = -Math.PI / 2;
    m.position.set(0, 0.03, -dd);
    m.scale.setScalar(0.2);
    scene.add(m);
    ripples.push({ m: m, age: 0, life: life, max: max });
  }
  var pGeo = new THREE.SphereGeometry(0.07, 6, 6);
  var pMat = new THREE.MeshBasicMaterial({ color: 0xfff3e6 });
  var parts = [];
  for (var pi = 0; pi < 44; pi++) {
    var pm = new THREE.Mesh(pGeo, pMat);
    pm.visible = false;

    invuln = 1.0;
    if (o) o.hit = true;
    if (kind === 'rock' || kind === 'log') d = Math.max(0, o.d - o.half - 0.5);
    else if (kind === 'bridge') d = Math.max(0, o.d - 0.9);
    // Clear the restart hop and the hop after it, so one mistake never costs two hearts.
    var clearTo = d + 6.6 + R.hopLength(R.Q.perfect, 1) + 1.5;
    for (var i = obs.length - 1; i >= 0; i--) {
      var ob = obs[i];
      if (ob.passed || ob.hit || ob.d - ob.half >= clearTo) continue;
      scene.remove(ob.m);
      if (ob.fly) {
        scene.remove(ob.fly.m);
        var fi = flies.indexOf(ob.fly);
        if (fi >= 0) flies.splice(fi, 1);
      }
      obs.splice(i, 1);
    }
    forceObs = false;
    cooldown = Math.max(cooldown, 2);
    splash(d, 10, 2.2);
    addRipple(d, 0xfff3e6, 2.4, 0.8);
    var say = { rock: 'Ouch!', log: 'Ouch!', bridge: 'Bonk!', whirl: 'Whirlpool!', plop: 'Splash!' };
    toast(say[kind] || 'Ouch!', 'weak');
    if (kind === 'plop' || kind === 'whirl') tone(300, 0.25, 'sine', 0.14, 90);
    else tone(160, 0.3, 'sawtooth', 0.12, 60);
    launch(d, 6.6, false);
  }

  function finishLevel() {
    marker.visible = false;
    // Score is lakes cleared, so a full run is worth 5.
    if (yt) { try { yt.engagement.sendScore({ value: curLevel + 1 }); } catch (e) {} }
    if (curLevel < LEVELS.length - 1) {
      state = 'clear';
      clearedIdx = curLevel;
      curLevel++;
      saveLevel();
      overUntil = performance.now() + 500;
      setPanel('clear');
    } else {
      state = 'ending';
      endT = 0;
      endPanel = false;
      clearedIdx = curLevel;
      curLevel = 0;
      saveLevel();
      stars.visible = true;
    }
  }

  function gameOver() {
    state = 'over';
    overUntil = performance.now() + 700;
    setPanel('over');
  }

  function onTap(evTime) {
    var now = performance.now();
    if (paused) return;
    if (state === 'ready') { if (ready) startGame(); return; }
    if (state === 'over') { if (now > overUntil) startGame(); return; }
    if (state === 'clear') { if (now > overUntil) resetToLevel(); return; }
    if (state === 'ending') { if (endPanel) resetToLevel(); return; }
    if (state !== 'play' || finished) return;
    // hop.t was last advanced at lastWall; the tap really happened at evTime.
    var tapAt = evTime > 0 && evTime <= now ? evTime : now;
    var extra = Math.max(-0.05, Math.min(0.05, (tapAt - lastWall) / 1000));
    if (hop.phase === 'air') {
      var left = hop.T - (hop.t + extra);
      if (left > EARLY) {
        rushed = true;
        toast('Too early', 'weak');
      } else {
        var off = -left;
        if (hop.tap === undefined || Math.abs(off) < Math.abs(hop.tap)) hop.tap = off;
      }
    } else if (hop.phase === 'skim') {
      // Late taps get the same window as early ones.
      bounce(Math.abs(hop.skim + extra));
    }
  }

  // Event timestamps share performance.now()'s clock in current browsers; older ones used epoch ms.
  function eventTime(e) {
    var t = e.timeStamp;
    return t > 0 && t <= performance.now() + 1 ? t : 0;
  }
  window.addEventListener('pointerdown', function (e) {
    if (e.target && e.target.closest && e.target.closest('#snd')) return;
    e.preventDefault();
    if (!e.isPrimary || e.button > 0) return;
    ensureAudio();
    onTap(eventTime(e));
  }, { passive: false });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) { ensureAudio(); onTap(eventTime(e)); }
    }
  });

  /* ---------- per-frame update ---------- */
  function stepPlay(dt) {
    var h = hop;
    invuln = Math.max(0, invuln - dt);
    if (h.phase === 'air') {
      h.t += dt;
      if (h.t >= h.T) {
        h.t = h.T;
        d = h.startD + h.L;
        y = 0;
        if (!finished && invuln <= 0) {
          for (var wi = 0; wi < obs.length; wi++) {
            var wo = obs[wi];
            if (wo.kind === 'whirl' && !wo.hit && R.collides('whirl', wo, wo.d - d, 0)) { loseHeart('whirl', wo); return; }
          }
        }
        if (finished) {
          bounce(0);
        } else if (h.tap !== undefined) {
          bounce(Math.abs(h.tap));
        } else {
          h.phase = 'skim';
          h.skim = 0;
          addRipple(d, 0xfff3e6, 1.6, 0.6);
          splash(d, 4, 1.2);
        }
      } else {
        var s = h.t / h.T;
        d = h.startD + h.L * s;
        y = 4 * h.H * s * (1 - s);
      }
    } else {
      // The stone waits on the landing spot, so a late tap launches from the same place as an early one.
      h.skim += dt;
      y = 0;
      if (h.skim >= SKIM) { loseHeart('plop'); return; }
    }
    if (!finished && d >= LV().goal) {
      finished = true;
      finishT = 0;
      toast('Lake cleared!', 'perfect');
      addRipple(LV().goal, 0xffd166, 6, 1.2);
      splash(d, 14, 2.6);
      tone(523, 0.3, 'triangle', 0.18);
      tone(659, 0.3, 'triangle', 0.16);
      tone(784, 0.5, 'triangle', 0.16);
    }
    if (finished) {
      finishT += dt;
      if (finishT > 1.9) finishLevel();
      return;
    }
    for (var i = 0; i < obs.length; i++) {
      var o = obs[i];
      if (o.hit || o.passed) continue;
      var dz = o.d - d;
      if (d > o.d + o.half + 0.25) {
        o.passed = true;
        if (o.kind !== 'whirl') {
          toast(o.kind === 'bridge' ? 'Under!' : 'Leap!', 'bonus');
          tone(988, 0.18, 'triangle', 0.12);
        }
        continue;
      }
      if (invuln > 0 || Math.abs(dz) > o.half + 0.2) continue;
      if (o.kind !== 'whirl' && R.collides(o.kind, o, dz, y)) { loseHeart(o.kind, o); return; }
    }
    for (var j = flies.length - 1; j >= 0; j--) {
      var f = flies[j];
      if (Math.abs(f.d - d) > 1.2) continue;
      var dy = y - f.y, dz = f.d - d;
      if (Math.sqrt(dy * dy + dz * dz) < 0.85) {
        scene.remove(f.m);
        flies.splice(j, 1);
        flyCount++;
        tone(1318, 0.2, 'sine', 0.1);
        toast('+ Firefly', 'bonus');
      }
    }
  }

  function stepCrash(dt) {
    crashT += dt;
    if (crashType !== 'plop' && crashType !== 'whirl') {
      cvy -= 14 * dt;
      y += cvy * dt;
      d += cvd * dt;
      cvd *= 0.96;
      if (y < 0 && !splashed) {
        splashed = true;
        splash(d, 8, 1.4);
        addRipple(d, 0xfff3e6, 2.2, 0.8);
        tone(260, 0.25, 'sine', 0.12, 80);
      }
      if (y < -0.6) y = -0.6;
    } else {
      y -= 2.2 * dt;
      if (y < -0.6) y = -0.6;
      d += cvd * dt;
      cvd *= 0.9;
    }
    if (crashT > 0.9) gameOver();
  }

  function stepEnding(dt) {
    endT += dt;
    d += 1.4 * dt;
    y = Math.pow(endT, 1.7) * 1.4;
    stoneMat.emissive.setHex(0xffd166);
    var gs = Math.min(9, endT * 3);
    stoneGlow.scale.set(gs, gs, 1);
    if (Math.random() < 0.3) splash(d, 1, 0.6);
    if (endT > 2.8 && !endPanel) {
      endPanel = true;
      setPanel('end');
      tone(784, 0.6, 'triangle', 0.14);
      tone(1046, 0.8, 'triangle', 0.12);
    }
  }

  function frame() {
    requestAnimationFrame(frame);
    var nowW = performance.now();
    var dt = Math.min(0.05, (nowW - lastWall) / 1000);
    lastWall = nowW;
    // Paused by YouTube: keep drawing the frozen scene, but advance nothing.
    if (paused) dt = 0;
    time += dt;
    waterU.uTime.value = time;

    if (paused) { /* frozen */ }
    else if (state === 'play') stepPlay(dt);
    else if (state === 'crash') stepCrash(dt);
    else if (state === 'ending') stepEnding(dt);
    else if (state === 'ready' || state === 'clear') { y = 0.14 + Math.sin(time * 2) * 0.05; }

    while (decorNext < d + 150) { spawnDecor(decorNext); decorNext += 4 + Math.random() * 6; }
    cull(obs, d); cull(flies, d); cull(decor, d);

    spin += dt * (state === 'play' ? 11 : 2);
    disc.rotation.y = spin;
    stone.position.set(0, Math.max(y, -0.6) + 0.06, -d);
    var tilt = 0;
    if (state === 'play' && hop && hop.phase === 'air') tilt = -0.22 + (hop.t / hop.T - 0.5) * 0.5;
    stone.rotation.x = tilt;
    shadow.position.set(0, 0.02, -d);
    shadow.visible = y > -0.05;
    var sh = Math.max(0.35, 1 - Math.max(0, y) * 0.35);
    shadow.scale.setScalar(sh);
    shadow.material.opacity = 0.3 * sh;
    stone.visible = !(state === 'play' && invuln > 0 && Math.floor(time * 14) % 2 === 0);

    if (state === 'play' && hop && !finished) {
      // Negative once the stone has landed and is skimming: the window runs both sides of the landing.
      var left = hop.phase === 'air' ? hop.T - hop.t : -hop.skim;
      var k = Math.max(0, Math.min(left / 0.7, 1));
      marker.visible = true;
      marker.position.z = -(hop.startD + hop.L);
      outerRing.scale.setScalar(0.55 + k * 1.4);
      outerMat.opacity = 0.35 + 0.55 * (1 - k);
      var inWin = Math.abs(left) <= perfectWin();
      innerMat.color.setHex(inWin ? 0xffd166 : 0xfff3e6);
      innerRing.scale.setScalar(inWin ? 1.15 : 1);
    } else {
      marker.visible = false;
    }

    for (var i = ripples.length - 1; i >= 0; i--) {
      var rp = ripples[i];
      rp.age += dt;
      var kk = rp.age / rp.life;
      if (kk >= 1) { scene.remove(rp.m); rp.m.material.dispose(); ripples.splice(i, 1); continue; }
      rp.m.scale.setScalar(0.2 + (rp.max - 0.2) * (1 - (1 - kk) * (1 - kk)));
      rp.m.material.opacity = 0.85 * (1 - kk);
    }
    for (var p = 0; p < parts.length; p++) {
      var pt = parts[p];
      if (pt.life <= 0) continue;
      pt.life -= dt;
      pt.vy -= 9 * dt;
      pt.m.position.x += pt.vx * dt;
      pt.m.position.y += pt.vy * dt;
      pt.m.position.z += pt.vz * dt;
      pt.m.scale.setScalar(Math.max(0.01, pt.life / pt.maxLife));
      if (pt.life <= 0 || (pt.m.position.y < 0.02 && state !== 'ending')) { pt.life = 0; pt.m.visible = false; }
    }
    for (var w = 0; w < obs.length; w++) {
      if (obs[w].kind === 'whirl') obs[w].m.rotation.z += dt * 1.4;
    }
    for (var q = 0; q < flies.length; q++) {
      var fl = flies[q];
      fl.m.position.y = fl.y + Math.sin(time * 3 + fl.phase) * 0.08;
      fl.m.children[1].scale.setScalar(1.0 + Math.sin(time * 5 + fl.phase) * 0.15);
    }

    if (state !== 'ending') setScore();

    camD += (d - camD) * Math.min(1, dt * 7);
    var up = Math.max(0, y);
    camera.position.set(0, 2.4 + up * (state === 'ending' ? 0.2 : 0.35), -camD + 5.6);
    camera.lookAt(0, 0.5 + up * (state === 'ending' ? 0.85 : 0.3), -camD - 8);
    sky.position.copy(camera.position);
    stars.position.copy(camera.position);
    far.position.set(0, 0, camera.position.z);
    water.position.set(camera.position.x, 0, camera.position.z);

    renderer.render(scene, camera);
    if (!firstFrame) {
      firstFrame = true;
      if (yt) { try { yt.game.firstFrameReady(); } catch (e) {} }
    }
  }

  /* ---------- YouTube Playables pause / resume ---------- */
  if (yt) {
    try {
      yt.system.onPause(function () {
        paused = true;
        if (actx) { try { actx.suspend(); } catch (e) {} }
      });
      yt.system.onResume(function () {
        paused = false;
        lastWall = performance.now();
        if (actx) { try { actx.resume(); } catch (e) {} }
      });
    } catch (e) {}
  }

  // The first lake shown waits for saved progress, then tells YouTube the game is ready.
  var firstFrame = false;
  resetToLevel();
  panel.hidden = true;
  frame();
  store.load().then(function (sv) {
    if (sv.level >= 0 && sv.level < LEVELS.length) curLevel = sv.level | 0;
    if (sv.muted) { muted = true; $('snd').setAttribute('aria-pressed', 'true'); }
    resetToLevel();
    ready = true;
    if (yt) { try { yt.game.gameReady(); } catch (e) {} }
  });
})();
</script>
</body>
</html>
